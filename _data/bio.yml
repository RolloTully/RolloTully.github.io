blurb: >-
  Hello! welcome, this is my super legit web 2.0 project portfolio, featuring only the finest formating 2001 has to offer.
  Here you can find some of the more successful projects I've worked on either by myself or with teams of friends and or colligues.

  This page gets updates time to time as projects mature into things I feel are worthy of seeing the light of day.
  I hope if goes without saying that behind this site is a grave yard of failed projects which may or may not be propped up again one day,
  those projects, if they got anywhere, live as messy code bases on my github, feel free to dig around.

  I'm currently working as a PhD candidate at the University of Manchester Digital Manufacturing Lab. 
  My work currently focuses on using computational method to design passivly morphing adaptive flow actuators(bendy propellors, very fancy).


