<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ page.description | default: site.title | escape }}">
    <meta name="author" content="Rollo Tully">
    <title>{{ page.title | default: site.title | escape }}</title>
    {% if page.redirect_to %}<meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}">{% endif %}
    <link href="{{ '/css/bootstrap.css' | relative_url }}" rel="stylesheet">
    <link href="{{ '/css/3-col-portfolio.css' | relative_url }}" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-fixed-top navbar-inverse" role="navigation">
      <div class="container">
        <div class="navbar-header">
          <button type="button" class="navbar-toggle" data-toggle="collapse" data-target="#site-navigation">
            <span class="sr-only">Toggle navigation</span>
            <span class="icon-bar"></span>
            <span class="icon-bar"></span>
            <span class="icon-bar"></span>
          </button>
          <a class="navbar-brand" href="{{ '/index.html' | relative_url }}"{% if page.home %} aria-current="page"{% endif %}>Home</a>
        </div>
        <div class="collapse navbar-collapse" id="site-navigation">
          <ul class="nav navbar-nav">
            <li{% if page.projects or page.project %} class="active"{% endif %}><a href="{{ '/projects.html' | relative_url }}">Projects</a></li>
            <li><a href="https://github.com/RolloTully">GitHub</a></li>
            <li><a href="{{ '/munro_map.html' | relative_url }}">Munro Map</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container">
      {{ content }}
    </main>

    <div class="container">
      <hr>
      <footer>
        <p>Copyright &copy; Rollo Tully {{ 'now' | date: '%Y' }}</p>
      </footer>
    </div>

    <script src="{{ '/js/jquery-1.10.2.js' | relative_url }}"></script>
    <script src="{{ '/js/bootstrap.js' | relative_url }}"></script>
  </body>
</html>
